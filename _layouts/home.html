<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <style>
    :root {
      --fg: #1a1a1a;
      --muted: #666;
      --link: #0366d6;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6e6e6; --muted: #999; --link: #58a6ff; }
      body { background: #0d1117; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--fg);
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
    }
    .avatar {
      display: block;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 2rem;
    }
    h1 { font-size: 2rem; margin: 0 0 .25rem; text-align: center; }
    h2 { font-size: 1.1rem; margin: 2rem 0 .5rem; }
    p  { margin: .25rem 0; }
    .meta { color: var(--muted); text-align: center; margin-bottom: .25rem; }
    ul { padding-left: 1.25rem; margin: .5rem 0; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .lead { text-align: center; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <main>
    <img class="avatar" src="{{ '/assets/profile.jpeg' | relative_url }}" alt="Dylan Goss">
    {{ content }}
  </main>
</body>
</html>
